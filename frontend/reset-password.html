<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – The Chaser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.4); }
    .btn-grad { background: linear-gradient(135deg, #3b82f6, #8b5cf6); transition: all 0.3s; }
    .btn-grad:hover { transform: scale(1.02); box-shadow: 0 20px 40px -10px rgba(59,130,246,0.4); }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 flex items-center justify-center min-h-screen px-4">

  <div class="glass-card rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full">
    <div class="text-center">
      <a href="/" class="text-3xl font-extrabold text-blue-600 block mb-2">📧 The Chaser</a>
      <h2 class="text-3xl font-bold text-gray-800 mt-2">Set New Password</h2>
      <p class="text-gray-500 text-sm mt-1">Enter your new password below.</p>
    </div>

    <form id="resetForm" class="mt-8 space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700">New Password</label>
        <input id="newPassword" type="password" placeholder="•••••••• (min 6 chars)" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required minlength="6" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
        <input id="confirmPassword" type="password" placeholder="••••••••" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required />
      </div>
      <button type="submit" class="w-full btn-grad text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/30">Reset Password</button>
      <div id="resetResult" class="text-sm text-center mt-2"></div>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      <a href="/login.html" class="text-blue-600 font-semibold hover:underline">← Back to login</a>
    </p>
  </div>

  <script>
    const API_URL = window.location.origin;

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('resetResult').innerHTML = '<p class="text-red-500">❌ No reset token found. Please request a new password reset.</p>';
    }

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (!newPassword || !confirmPassword) {
        document.getElementById('resetResult').innerHTML = '<p class="text-red-500">Please fill in both fields.</p>';
        return;
      }

      if (newPassword.length < 6) {
        document.getElementById('resetResult').innerHTML = '<p class="text-red-500">Password must be at least 6 characters.</p>';
        return;
      }

      if (newPassword !== confirmPassword) {
        document.getElementById('resetResult').innerHTML = '<p class="text-red-500">Passwords do not match.</p>';
        return;
      }

      document.getElementById('resetResult').innerHTML = '<p class="text-blue-500">⏳ Resetting password...</p>';

      try {
        const res = await fetch(`${API_URL}/api/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('resetResult').innerHTML = `
            <p class="text-green-600">✅ ${data.message}</p>
            <p class="text-gray-500 text-sm mt-2">Redirecting to login...</p>
          `;
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        } else {
          document.getElementById('resetResult').innerHTML = `<p class="text-red-500">❌ ${data.error}</p>`;
        }
      } catch (err) {
        document.getElementById('resetResult').innerHTML = '<p class="text-red-500">❌ Server error. Please try again.</p>';
        console.error(err);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – The Chaser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; }
    .glass-sidebar { background: rgba(255,255,255,0.75); backdrop-filter: blur(16px); border-right: 1px solid rgba(255,255,255,0.3); }
    .glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.4); }
    .btn-grad { background: linear-gradient(135deg, #3b82f6, #8b5cf6); transition: all 0.3s; }
    .btn-grad:hover { transform: scale(1.02); box-shadow: 0 20px 40px -10px rgba(59,130,246,0.4); }
    .nav-link:hover { background: rgba(59, 130, 246, 0.08); color: #2563eb; }
    .nav-link.active { background: rgba(59, 130, 246, 0.12); color: #2563eb; font-weight: 600; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 flex min-h-screen">

  <!-- ========== SIDEBAR ========== -->
  <aside class="glass-sidebar fixed left-0 top-0 h-full w-64 shadow-xl z-50 p-6 flex flex-col">
    <div class="text-2xl font-extrabold text-blue-600 mb-8">📧 The Chaser</div>
    <nav class="flex-1 space-y-1.5">
      <a href="/" class="nav-link flex items-center gap-3 p-3 rounded-xl text-gray-700"><i class="fas fa-home w-5 text-blue-500"></i> Home</a>
      <a href="/dashboard.html" id="navDashboard" class="nav-link hidden flex items-center gap-3 p-3 rounded-xl text-gray-700"><i class="fas fa-chart-pie w-5 text-blue-500"></i> Dashboard</a>
      <a href="/login.html" id="navLogin" class="nav-link flex items-center gap-3 p-3 rounded-xl text-gray-700"><i class="fas fa-sign-in-alt w-5 text-blue-500"></i> Login</a>
      <a href="/register.html" class="nav-link active flex items-center gap-3 p-3 rounded-xl text-gray-700"><i class="fas fa-user-plus w-5 text-blue-500"></i> Register</a>
      <button onclick="logoutUser()" id="navLogout" class="nav-link hidden w-full text-left flex items-center gap-3 p-3 rounded-xl text-red-500 hover:bg-red-50"><i class="fas fa-sign-out-alt w-5"></i> Logout</button>
    </nav>
    <div class="text-xs text-gray-400 mt-auto border-t border-gray-200/50 pt-4">v1.0</div>
  </aside>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="flex-1 ml-64 flex items-center justify-center p-6">
    <div class="glass-card rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full">
      <div class="text-center">
        <span class="text-4xl">📧</span>
        <h2 class="text-3xl font-bold text-gray-800 mt-2">Create your account</h2>
        <p class="text-gray-500 text-sm mt-1">Start your 14-day free trial — no credit card needed.</p>
      </div>

      <form id="registerForm" class="mt-8 space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700">Firm Name</label>
          <input id="firmName" type="text" placeholder="Smith & Associates" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Business Email</label>
          <input id="firmEmail" type="email" placeholder="info@smith.com" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input id="firmPassword" type="password" placeholder="••••••••" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required minlength="6">
        </div>
        <button type="submit" class="w-full btn-grad text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/30">Start Free Trial</button>
        <div id="registerResult" class="text-sm text-center mt-2"></div>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">Already have an account? <a href="/login.html" class="text-blue-600 font-semibold hover:underline">Log in</a></p>
    </div>
  </main>

  <script>
    const API_URL = window.location.origin;

    // Sidebar logic
    const firmId = localStorage.getItem('chaser_firm_id');
    const navDashboard = document.getElementById('navDashboard');
    const navLogout = document.getElementById('navLogout');
    const navLogin = document.getElementById('navLogin');

    if (firmId) {
      navDashboard.classList.remove('hidden');
      navLogout.classList.remove('hidden');
      navLogin.classList.add('hidden');
    } else {
      navDashboard.classList.add('hidden');
      navLogout.classList.add('hidden');
      navLogin.classList.remove('hidden');
    }

    function logoutUser() {
      localStorage.removeItem('chaser_firm_id');
      localStorage.removeItem('chaser_firm_name');
      window.location.href = '/';
    }

    // Register form
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('firmName').value.trim();
      const email = document.getElementById('firmEmail').value.trim();
      const password = document.getElementById('firmPassword').value.trim();

      if (!name || !email || !password) {
        document.getElementById('registerResult').innerHTML = '<p class="text-red-500">All fields required.</p>';
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/firms`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('chaser_firm_id', data.firm.id);
          localStorage.setItem('chaser_firm_name', data.firm.name);
          window.location.href = '/dashboard.html';
        } else {
          document.getElementById('registerResult').innerHTML = `<p class="text-red-500">❌ ${data.error}</p>`;
        }
      } catch (err) {
        document.getElementById('registerResult').innerHTML = '<p class="text-red-500">❌ Server error.</p>';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – The Chaser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📧</text></svg>" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.4); }
    .btn-grad { background: linear-gradient(135deg, #3b82f6, #8b5cf6); transition: all 0.3s; }
    .btn-grad:hover { transform: scale(1.02); box-shadow: 0 20px 40px -10px rgba(59,130,246,0.4); }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 flex items-center justify-center min-h-screen px-4">

  <div class="glass-card rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full">
    <div class="text-center">
      <a href="/" class="text-3xl font-extrabold text-blue-600 block mb-2">📧 The Chaser</a>
      <h2 class="text-3xl font-bold text-gray-800 mt-2">Create your account</h2>
      <p class="text-gray-500 text-sm mt-1">Start your 14-day free trial — no credit card needed.</p>
    </div>

    <form id="registerForm" class="mt-8 space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700">Firm Name</label>
        <input id="firmName" type="text" placeholder="Smith & Associates" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Business Email</label>
        <input id="firmEmail" type="email" placeholder="info@smith.com" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input id="firmPassword" type="password" placeholder="•••••••• (min 6 chars)" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required minlength="6" />
      </div>
      <button type="submit" class="w-full btn-grad text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/30">Start Free Trial</button>
      <div id="registerResult" class="text-sm text-center mt-2"></div>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">Already have an account? <a href="/login.html" class="text-blue-600 font-semibold hover:underline">Log in</a></p>
  </div>

  <script>
    const API_URL = window.location.origin;

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('firmName').value.trim();
      const email = document.getElementById('firmEmail').value.trim();
      const password = document.getElementById('firmPassword').value.trim();

      if (!name || !email || !password) {
        document.getElementById('registerResult').innerHTML = '<p class="text-red-500">All fields are required.</p>';
        return;
      }

      if (password.length < 6) {
        document.getElementById('registerResult').innerHTML = '<p class="text-red-500">Password must be at least 6 characters.</p>';
        return;
      }

      document.getElementById('registerResult').innerHTML = '<p class="text-blue-500">⏳ Creating your account...</p>';

      try {
        const res = await fetch(`${API_URL}/api/firms`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (data.success) {
          // Send verification email
          await fetch(`${API_URL}/api/send-verification`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });

          document.getElementById('registerResult').innerHTML = `
            <p class="text-green-600">✅ Account created!</p>
            <p class="text-gray-500 text-sm mt-1">We sent a verification email to <strong>${email}</strong>.</p>
            <p class="text-gray-500 text-sm">Please verify your email to log in.</p>
            <p class="text-gray-500 text-sm mt-2">Redirecting to login...</p>
          `;

          document.getElementById('firmName').value = '';
          document.getElementById('firmEmail').value = '';
          document.getElementById('firmPassword').value = '';

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 5000);
        } else {
          document.getElementById('registerResult').innerHTML = `<p class="text-red-500">❌ ${data.error}</p>`;
        }
      } catch (err) {
        document.getElementById('registerResult').innerHTML = '<p class="text-red-500">❌ Server error. Please try again.</p>';
        console.error(err);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Receipt – The Chaser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.4); }
    .btn-grad { background: linear-gradient(135deg, #3b82f6, #8b5cf6); transition: all 0.3s; }
    .btn-grad:hover { transform: scale(1.02); box-shadow: 0 20px 40px -10px rgba(59,130,246,0.4); }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 flex items-center justify-center min-h-screen px-4">

  <div class="glass-card rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full text-center">
    <a href="/" class="text-2xl font-extrabold text-blue-600 block">📧 The Chaser</a>
    <span class="text-5xl block my-4">📸</span>
    <h2 class="text-2xl font-bold text-gray-800">Upload Receipt</h2>
    <p class="text-gray-500 text-sm mt-1">Your accountant needs this receipt.</p>

    <div class="mt-6 space-y-4">
      <input type="file" id="fileInput" accept="image/*" class="w-full border border-gray-200 rounded-xl p-2 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
      <input id="clientId" type="text" placeholder="Your Client ID" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 transition" />
      <button onclick="uploadReceipt()" class="w-full btn-grad text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/30">Upload Now</button>
      <div id="result" class="text-sm mt-2"></div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;

    async function uploadReceipt() {
      const fileInput = document.getElementById('fileInput');
      const clientId = document.getElementById('clientId').value.trim();
      const file = fileInput.files[0];

      if (!file || !clientId) {
        document.getElementById('result').innerHTML = '<p class="text-red-500">Select a file and enter your Client ID.</p>';
        return;
      }

      const formData = new FormData();
      formData.append('receipt', file);
      formData.append('client_id', clientId);

      try {
        const res = await fetch(`${API_URL}/api/upload-receipt`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('result').innerHTML = `<p class="text-green-600">✅ Uploaded! Category: <b>${data.category}</b></p>`;
          document.getElementById('fileInput').value = '';
          document.getElementById('clientId').value = '';
        } else {
          document.getElementById('result').innerHTML = `<p class="text-red-500">❌ ${data.error}</p>`;
        }
      } catch (err) {
        document.getElementById('result').innerHTML = '<p class="text-red-500">❌ Server error.</p>';
      }
    }
  </script>
</body>
</html>

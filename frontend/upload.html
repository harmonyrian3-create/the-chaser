<!DOCTYPE html>
<html>
<head>
  <title>Upload Receipts</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-96">
    <h1 class="text-2xl font-bold mb-2 text-green-600">📸 Upload Receipt</h1>
    <p class="text-gray-600 text-sm">Drag a photo or click to browse.</p>
    <input type="file" id="fileInput" accept="image/*" class="mt-4 border p-2 w-full">
    <input type="text" id="clientId" placeholder="Your Client ID" class="mt-2 border p-2 w-full">
    <button onclick="uploadReceipt()" class="mt-4 bg-green-600 text-white px-4 py-2 rounded w-full hover:bg-green-700">
      Upload Receipt
    </button>
    <div id="result" class="mt-4 text-sm"></div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000';

    async function uploadReceipt() {
      const fileInput = document.getElementById('fileInput');
      const clientId = document.getElementById('clientId').value;
      const file = fileInput.files[0];

      if (!file || !clientId) {
        alert('Select a file and enter your Client ID');
        return;
      }

      const formData = new FormData();
      formData.append('receipt', file);
      formData.append('client_id', clientId);

      try {
        const res = await fetch(`${API_URL}/api/upload-receipt`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('result').innerHTML = `<p class="text-green-600">✅ Uploaded! Categorized as: <b>${data.category}</b></p>`;
        } else {
          document.getElementById('result').innerHTML = `<p class="text-red-600">❌ Error: ${data.error}</p>`;
        }
      } catch (err) {
        alert('Cannot connect to server.');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipts – The Chaser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    
    :root {
      --bg-color: #0f172a;
      --text-color: #f1f5f9;
      --card-color: #1e293b;
      --border-color: #334155;
      --accent-color: #3b82f6;
      --bg-image: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .bg-card { background-color: var(--card-color); border-color: var(--border-color); }
    .text-accent { color: var(--accent-color); }
    .border-accent { border-color: var(--accent-color); }
    .bg-accent { background-color: var(--accent-color); }
    
    .glass-sidebar { 
      background: var(--card-color); 
      backdrop-filter: blur(16px); 
      border-right: 1px solid var(--border-color); 
    }
    
    .btn-grad { 
      background: linear-gradient(135deg, var(--accent-color), #8b5cf6); 
      transition: all 0.3s; 
    }
    .btn-grad:hover { transform: scale(1.02); box-shadow: 0 20px 40px -10px rgba(59,130,246,0.4); }
    
    .nav-link:hover { background: rgba(59, 130, 246, 0.08); color: var(--accent-color); }
    .nav-link.active { background: rgba(59, 130, 246, 0.12); color: var(--accent-color); font-weight: 600; }
    
    .sidebar-collapsed { width: 72px !important; }
    .sidebar-collapsed .nav-text { display: none; }
    .sidebar-collapsed .brand-text { display: none; }
    .sidebar-collapsed .nav-link { justify-content: center; padding: 12px; }
    .sidebar-collapsed .footer-text { display: none; }
    
    .input-field {
      background: var(--card-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 12px;
      transition: all 0.3s;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--accent-color);
    }
    .input-field::placeholder {
      color: var(--text-color);
      opacity: 0.5;
    }
    
    .receipt-card { transition: all 0.3s; background: var(--card-color); border: 1px solid var(--border-color); }
    .receipt-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.2); }
    .border-custom { border-color: var(--border-color); }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="glass-sidebar fixed left-0 top-0 h-full w-64 shadow-xl z-50 p-4 flex flex-col transition-all duration-300">
    <div class="flex items-center justify-between mb-6">
      <span class="brand-text text-2xl font-extrabold text-accent">📧 The Chaser</span>
      <button onclick="toggleSidebar()" class="text-gray-500 hover:text-accent transition">
        <i class="fas fa-bars text-xl"></i>
      </button>
    </div>
    <nav class="flex-1 space-y-1.5">
      <a href="/dashboard.html" class="nav-link flex items-center gap-3 p-3 rounded-xl text-gray-700"><i class="fas fa-chart-pie w-5 text-accent"></i><span class="nav-text">Dashboard</span></a>
      <a href="/receipts.html" class="nav-link active flex items-center gap-3 p-3 rounded-xl text-gray-700"><i class="fas fa-receipt w-5 text-accent"></i><span class="nav-text">Receipts</span></a>
      <a href="/pricing.html" class="nav-link flex items-center gap-3 p-3 rounded-xl text-gray-700"><i class="fas fa-tag w-5 text-accent"></i><span class="nav-text">Pricing</span></a>
      <a href="/settings.html" class="nav-link flex items-center gap-3 p-3 rounded-xl text-gray-700"><i class="fas fa-cog w-5 text-accent"></i><span class="nav-text">Settings</span></a>
      <button onclick="logoutUser()" class="nav-link flex w-full text-left items-center gap-3 p-3 rounded-xl text-red-500 hover:bg-red-50"><i class="fas fa-sign-out-alt w-5"></i><span class="nav-text">Logout</span></button>
    </nav>
    <div class="footer-text text-xs text-gray-400 mt-auto border-t border-gray-200/50 pt-4">🏢 <span id="firmDisplay">My Firm</span></div>
  </aside>

  <!-- MAIN -->
  <main id="mainContent" class="flex-1 ml-64 p-8 transition-all duration-300">
    <div class="max-w-6xl mx-auto">
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <h1 class="text-3xl font-extrabold" style="color: var(--text-color);">📄 Receipts</h1>
        <div class="flex gap-2 flex-wrap">
          <input id="searchInput" placeholder="Search receipts..." class="input-field w-48" />
          <select id="filterCategory" class="input-field w-40">
            <option value="">All Categories</option>
            <option value="Meals">Meals</option>
            <option value="Travel">Travel</option>
            <option value="Supplies">Supplies</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div id="receiptList" class="space-y-4">
        <p class="text-center py-12 opacity-50" style="color: var(--text-color);">Loading receipts...</p>
      </div>
    </div>
  </main>

  <script src="/theme.js"></script>
  <script>
    const API_URL = window.location.origin;
    const token = localStorage.getItem('chaser_token');
    const firmName = localStorage.getItem('chaser_firm_name');

    if (!token) window.location.href = '/login.html';
    document.getElementById('firmDisplay').innerText = firmName || 'My Firm';

    function getHeaders() {
      return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('sidebar-collapsed');
      const main = document.getElementById('mainContent');
      if (document.getElementById('sidebar').classList.contains('sidebar-collapsed')) {
        main.classList.remove('ml-64'); main.classList.add('ml-[72px]');
      } else {
        main.classList.remove('ml-[72px]'); main.classList.add('ml-64');
      }
    }

    function logoutUser() {
      localStorage.removeItem('chaser_token');
      localStorage.removeItem('chaser_firm_id');
      localStorage.removeItem('chaser_firm_name');
      window.location.href = '/';
    }

    async function loadReceipts() {
      try {
        const res = await fetch(`${API_URL}/api/receipts`, { headers: getHeaders() });
        const data = await res.json();
        if (data.success) renderReceipts(data.receipts);
      } catch (err) { console.error(err); }
    }

    function renderReceipts(receipts) {
      const container = document.getElementById('receiptList');
      if (!receipts || receipts.length === 0) {
        container.innerHTML = `<p class="text-center py-12 opacity-50" style="color: var(--text-color);">No receipts uploaded yet.</p>`;
        return;
      }

      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('filterCategory').value;

      const filtered = receipts.filter(r => {
        const matchSearch = r.extracted_text?.toLowerCase().includes(search) || false;
        const matchCategory = category ? r.category === category : true;
        return matchSearch && matchCategory;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center py-12 opacity-50" style="color: var(--text-color);">No receipts match your filters.</p>`;
        return;
      }

      const categoryColors = {
        'Meals': 'bg-yellow-500/20 text-yellow-400',
        'Travel': 'bg-blue-500/20 text-blue-400',
        'Supplies': 'bg-green-500/20 text-green-400',
        'Other': 'bg-gray-500/20 text-gray-400'
      };

      let html = '';
      filtered.forEach(r => {
        html += `
          <div class="receipt-card rounded-2xl shadow-md p-6 border border-custom">
            <div class="flex flex-wrap justify-between items-start gap-4">
              <div class="flex-1">
                <p class="text-sm opacity-60" style="color: var(--text-color);">${new Date(r.upload_date).toLocaleDateString()} · Client: ${r.client_name || 'Unknown'}</p>
                <p class="mt-1" style="color: var(--text-color);">${r.extracted_text || 'No text extracted'}</p>
              </div>
              <span class="text-sm ${categoryColors[r.category] || 'bg-gray-500/20 text-gray-400'} px-4 py-1 rounded-full">${r.category || 'Uncategorized'}</span>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    document.getElementById('searchInput').addEventListener('input', loadReceipts);
    document.getElementById('filterCategory').addEventListener('change', loadReceipts);

    loadTheme();
    loadReceipts();
  </script>
</body>
</html>

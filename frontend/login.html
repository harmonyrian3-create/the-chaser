<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in – The Chaser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📧</text></svg>" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.4); }
    .btn-grad { background: linear-gradient(135deg, #3b82f6, #8b5cf6); transition: all 0.3s; }
    .btn-grad:hover { transform: scale(1.02); box-shadow: 0 20px 40px -10px rgba(59,130,246,0.4); }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 flex items-center justify-center min-h-screen px-4">

  <div class="glass-card rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full">
    <div class="text-center">
      <a href="/" class="text-3xl font-extrabold text-blue-600 block mb-2">📧 The Chaser</a>
      <h2 class="text-3xl font-bold text-gray-800 mt-2">Welcome back</h2>
      <p class="text-gray-500 text-sm mt-1">Log in to your dashboard</p>
    </div>

    <form id="loginForm" class="mt-8 space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input id="loginEmail" type="email" placeholder="info@smith.com" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" required />
      </div>
      <div class="text-right">
        <a href="/forgot-password.html" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
      </div>
      <button type="submit" class="w-full btn-grad text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/30">Log In</button>
      <div id="loginResult" class="text-sm text-center mt-2"></div>
    </form>

    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-300"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-white text-gray-500">Or continue with</span>
      </div>
    </div>

    <a href="/api/auth/google" class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-xl py-3 hover:bg-gray-50 transition">
      <svg class="w-5 h-5" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Sign in with Google</span>
    </a>

    <p class="text-center text-sm text-gray-500 mt-6">Don't have an account? <a href="/register.html" class="text-blue-600 font-semibold hover:underline">Sign up free</a></p>
  </div>

  <script>
    const API_URL = window.location.origin;

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        document.getElementById('loginResult').innerHTML = '<p class="text-red-500">All fields required.</p>';
        return;
      }

      document.getElementById('loginResult').innerHTML = '<p class="text-blue-500">⏳ Logging in...</p>';

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('chaser_token', data.token);
          localStorage.setItem('chaser_firm_id', data.firm.id);
          localStorage.setItem('chaser_firm_name', data.firm.name);

          document.getElementById('loginResult').innerHTML = '<p class="text-green-600">✅ Login successful! Redirecting...</p>';

          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          document.getElementById('loginResult').innerHTML = `<p class="text-red-500">❌ ${data.error}</p>`;
          if (data.error && data.error.includes('verify')) {
            document.getElementById('loginResult').innerHTML += `
              <p class="text-sm mt-2 text-center">
                <a href="#" onclick="resendVerification('${email}')" class="text-blue-600 hover:underline">Resend verification email</a>
              </p>
            `;
          }
        }
      } catch (err) {
        document.getElementById('loginResult').innerHTML = '<p class="text-red-500">❌ Server error. Please try again.</p>';
        console.error(err);
      }
    });

    async function resendVerification(email) {
      document.getElementById('loginResult').innerHTML = '<p class="text-blue-500">⏳ Sending verification email...</p>';
      try {
        const res = await fetch(`${API_URL}/api/send-verification`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('loginResult').innerHTML = `
            <p class="text-green-600">✅ Verification email sent!</p>
            <p class="text-gray-500 text-sm mt-1">Check your inbox and spam folder.</p>
          `;
        } else {
          document.getElementById('loginResult').innerHTML = `<p class="text-red-500">❌ ${data.error}</p>`;
        }
      } catch (err) {
        document.getElementById('loginResult').innerHTML = '<p class="text-red-500">❌ Server error.</p>';
      }
    }
  </script>
</body>
</html>

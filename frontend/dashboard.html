<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – The Chaser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center">
          <span class="text-2xl font-bold text-blue-600">📧 The Chaser</span>
          <span class="ml-4 text-sm text-gray-400">| Dashboard</span>
        </div>
        <div class="flex items-center space-x-4">
          <span id="firmDisplay" class="text-sm text-gray-600 bg-gray-100 px-4 py-2 rounded-lg"></span>
          <a href="/" class="text-gray-500 hover:text-blue-600 transition"><i class="fas fa-sign-out-alt"></i></a>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Stats Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white rounded-xl shadow p-6">
        <div class="flex items-center gap-4">
          <div class="bg-blue-100 p-3 rounded-xl">
            <i class="fas fa-users text-blue-600 text-xl"></i>
          </div>
          <div>
            <p class="text-sm text-gray-500">Total Clients</p>
            <p class="text-2xl font-bold" id="totalClients">0</p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow p-6">
        <div class="flex items-center gap-4">
          <div class="bg-yellow-100 p-3 rounded-xl">
            <i class="fas fa-clock text-yellow-600 text-xl"></i>
          </div>
          <div>
            <p class="text-sm text-gray-500">Awaiting Receipts</p>
            <p class="text-2xl font-bold" id="awaitingClients">0</p>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow p-6">
        <div class="flex items-center gap-4">
          <div class="bg-green-100 p-3 rounded-xl">
            <i class="fas fa-check-circle text-green-600 text-xl"></i>
          </div>
          <div>
            <p class="text-sm text-gray-500">Uploaded</p>
            <p class="text-2xl font-bold" id="uploadedClients">0</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Client -->
    <div class="bg-white rounded-xl shadow p-6 mb-8">
      <h3 class="text-lg font-semibold mb-4">➕ Add Client</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input id="clientName" placeholder="Full Name" class="border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="clientEmail" placeholder="Email" class="border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="clientPhone" placeholder="Phone (Optional)" class="border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button onclick="addClient()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-xl hover:bg-blue-700 transition">
        <i class="fas fa-plus mr-2"></i> Add Client
      </button>
      <div id="clientResult" class="mt-3 text-sm"></div>
    </div>

    <!-- Client List -->
    <div class="bg-white rounded-xl shadow p-6">
      <h3 class="text-lg font-semibold mb-4">📋 Your Clients</h3>
      <div id="clientList" class="space-y-3">
        <p class="text-gray-400 text-sm">No clients yet. Add your first client above!</p>
      </div>
    </div>

  </div>

  <script>
    const API_URL = 'https://the-chaser.onrender.com';
    const firmId = localStorage.getItem('chaser_firm_id');
    const firmName = localStorage.getItem('chaser_firm_name');

    if (!firmId) {
      window.location.href = '/register.html';
    }

    document.getElementById('firmDisplay').innerText = `🏢 ${firmName || 'My Firm'}`;

    async function loadClients() {
      try {
        const res = await fetch(`${API_URL}/api/clients?firm_id=${firmId}`);
        const data = await res.json();
        if (data.success) {
          renderClients(data.clients);
        }
      } catch (err) {
        console.error('Error loading clients:', err);
      }
    }

    function renderClients(clients) {
      const container = document.getElementById('clientList');
      if (!clients || clients.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-sm">No clients yet. Add your first client above!</p>`;
        return;
      }

      let html = '';
      let awaiting = 0;
      let uploaded = 0;

      clients.forEach(c => {
        if (c.status === 'awaiting') awaiting++;
        if (c.status === 'uploaded') uploaded++;

        const statusColor = c.status === 'awaiting' ? 'text-yellow-600 bg-yellow-50' : 'text-green-600 bg-green-50';
        const statusIcon = c.status === 'awaiting' ? '🕐' : '✅';

        html += `
          <div class="flex items-center justify-between border-b border-gray-100 pb-3">
            <div>
              <p class="font-medium">${c.name}</p>
              <p class="text-sm text-gray-400">${c.email}</p>
            </div>
            <span class="text-sm ${statusColor} px-3 py-1 rounded-full">${statusIcon} ${c.status}</span>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById('totalClients').innerText = clients.length;
      document.getElementById('awaitingClients').innerText = awaiting;
      document.getElementById('uploadedClients').innerText = uploaded;
    }

    async function addClient() {
      const name = document.getElementById('clientName').value.trim();
      const email = document.getElementById('clientEmail').value.trim();
      const phone = document.getElementById('clientPhone').value.trim();

      if (!name || !email) {
        document.getElementById('clientResult').innerHTML = `<p class="text-red-500">⚠️ Name and email are required.</p>`;
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/clients`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firm_id: firmId, name, email, phone })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('clientResult').innerHTML = `<p class="text-green-600">✅ ${name} added! Reminder sent.</p>`;
          document.getElementById('clientName').value = '';
          document.getElementById('clientEmail').value = '';
          document.getElementById('clientPhone').value = '';
          loadClients();
        } else {
          document.getElementById('clientResult').innerHTML = `<p class="text-red-500">❌ ${data.error}</p>`;
        }
      } catch (err) {
        document.getElementById('clientResult').innerHTML = `<p class="text-red-500">❌ Server error.</p>`;
      }
    }

    loadClients();
  </script>
</body>
</html>
